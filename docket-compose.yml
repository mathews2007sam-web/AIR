version: "3.8"
services:
  service1:
    build:
      context: ./repo1
      dockerfile: Dockerfile
    ports:
      - "3001:3000"      # map host port 3001 to container 3000
    environment:
      - NODE_ENV=development
  service2:
    build:
      context: ./repo2
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    environment:
      - FLASK_ENV=development
  service3:
    build:
      context: ./repo3
      dockerfile: Dockerfile
    ports:
      - "3003:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
networks:
  default:
    driver: bridge
