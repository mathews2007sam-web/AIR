<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airline Reservation System - Payment</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="payment-wrapper">
  <div class="payment-card">
    <h1>Complete Your Payment</h1>
    <p class="subtitle">PNR: <span id="pnrValue">AR12345</span></p>

    <div class="amount-box">
      <span>Amount Due</span>
      <span class="amount">$248.50</span>
    </div>

    <form id="paymentForm">
      <label for="paymentMethod">Payment Method</label>
      <select id="paymentMethod" name="paymentMethod">
        <option value="card">Credit / Debit Card</option>
        <option value="wallet">Digital Wallet</option>
        <option value="netbanking">Net Banking</option>
        <option value="travelCredit">Airline Travel Credit</option>
      </select>

      <div id="cardFields">
        <label for="cardNumber">Card Number</label>
        <input type="text" id="cardNumber" name="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19">

        <div class="form-row">
          <div>
            <label for="expiry">Expiry (MM/YY)</label>
            <input type="text" id="expiry" name="expiry" placeholder="MM/YY" maxlength="5">
          </div>
          <div>
            <label for="cvv">CVV</label>
            <input type="password" id="cvv" name="cvv" placeholder="123" maxlength="4">
          </div>
        </div>

        <label for="cardHolder">Name on Card</label>
        <input type="text" id="cardHolder" name="cardHolder" placeholder="As shown on card">
      </div>

      <label class="checkbox-label">
        <input type="checkbox" id="splitPayment" name="splitPayment">
        Split payment across two methods
      </label>

      <div id="splitFields" class="hidden">
        <label for="splitAmount">Amount to charge this method</label>
        <input type="number" id="splitAmount" name="splitAmount" placeholder="0.00" step="0.01">
      </div>

      <button type="submit" id="payButton">Pay Now</button>
    </form>

    <div id="statusMessage" class="status-message hidden"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
