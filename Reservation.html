<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airline Reservation System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f2f6fc;
}

.container{
    width:700px;
    margin:30px auto;
    background:#fff;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#004080;
    margin-bottom:20px;
}

label{
    font-weight:bold;
    display:block;
    margin-top:12px;
}

input,
select{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #999;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#004080;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#0066cc;
}

#result{
    display:none;
    margin-top:25px;
    background:#eaf5ea;
    border-left:5px solid green;
    padding:15px;
}
</style>

</head>

<body>

<div class="container">

<h1>Airline Reservation System</h1>

<form id="reservationForm">

<label>Passenger Name</label>
<input type="text" id="name" required>

<label>Email</label>
<input type="email" id="email" required>

<label>Phone Number</label>
<input type="tel" id="phone" required>

<label>From</label>
<input type="text" id="from" required>

<label>To</label>
<input type="text" id="to" required>

<label>Departure Date</label>
<input type="date" id="date" required>

<label>Number of Passengers</label>
<input type="number" id="count" min="1" value="1">

<label>Travel Class</label>
<select id="class">
<option>Economy</option>
<option>Premium Economy</option>
<option>Business</option>
<option>First Class</option>
</select>

<label>Seat Preference</label>
<select id="seat">
<option>Window</option>
<option>Aisle</option>
<option>Middle</option>
</select>

<label>Extra Baggage</label>
<select id="bag">
<option>No</option>
<option>Yes</option>
</select>

<button type="submit">Reserve Ticket</button>

</form>

<div id="result">

<h2>Reservation Successful</h2>

<p><strong>Passenger :</strong> <span id="rname"></span></p>

<p><strong>Email :</strong> <span id="remail"></span></p>

<p><strong>Phone :</strong> <span id="rphone"></span></p>

<p><strong>Route :</strong> <span id="rroute"></span></p>

<p><strong>Date :</strong> <span id="rdate"></span></p>

<p><strong>Passengers :</strong> <span id="rcount"></span></p>

<p><strong>Class :</strong> <span id="rclass"></span></p>

<p><strong>Seat :</strong> <span id="rseat"></span></p>

<p><strong>Baggage :</strong> <span id="rbag"></span></p>

<p><strong>PNR :</strong> <span id="pnr"></span></p>

</div>

</div>

<script>

// Reservation Form Submission
document.getElementById("reservationForm").addEventListener("submit",function(e){

e.preventDefault();

// Read values
let name=document.getElementById("name").value;
let email=document.getElementById("email").value;
let phone=document.getElementById("phone").value;
let from=document.getElementById("from").value;
let to=document.getElementById("to").value;
let date=document.getElementById("date").value;
let count=document.getElementById("count").value;
let travelClass=document.getElementById("class").value;
let seat=document.getElementById("seat").value;
let bag=document.getElementById("bag").value;

// Generate Random PNR
let pnr="PNR"+Math.floor(Math.random()*900000+100000);

// Display Reservation Details
document.getElementById("rname").innerHTML=name;
document.getElementById("remail").innerHTML=email;
document.getElementById("rphone").innerHTML=phone;
document.getElementById("rroute").innerHTML=from+" → "+to;
document.getElementById("rdate").innerHTML=date;
document.getElementById("rcount").innerHTML=count;
document.getElementById("rclass").innerHTML=travelClass;
document.getElementById("rseat").innerHTML=seat;
document.getElementById("rbag").innerHTML=bag;
document.getElementById("pnr").innerHTML=pnr;

// Show Result
document.getElementById("result").style.display="block";

});

</script>

</body>
</html>
