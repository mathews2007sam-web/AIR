<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Airline Ticket Reservation</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #74ebd5, #ACB6E5);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .reservation-form {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      width: 350px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    .reservation-form h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
    }
    input, select, button {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background: #007bff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .confirmation {
      margin-top: 20px;
      padding: 15px;
      background: #e6ffe6;
      border: 1px solid #00cc66;
      border-radius: 5px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="reservation-form">
    <h2>Airline Ticket Reservation</h2>
    <form id="ticketForm">
      <label for="name">Passenger Name</label>
      <input type="text" id="name" required>

      <label for="from">From</label>
      <input type="text" id="from" required>

      <label for="to">To</label>
      <input type="text" id="to" required>

      <label for="date">Travel Date</label>
      <input type="date" id="date" required>

      <label for="class">Class</label>
      <select id="class" required>
        <option value="">Select Class</option>
        <option value="Economy">Economy</option>
        <option value="Business">Business</option>
        <option value="First">First Class</option>
      </select>

      <button type="submit">Reserve Ticket</button>
    </form>

    <div class="confirmation" id="confirmationBox"></div>
  </div>

  <script>
    document.getElementById("ticketForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const name = document.getElementById("name").value;
      const from = document.getElementById("from").value;
      const to = document.getElementById("to").value;
      const date = document.getElementById("date").value;
      const travelClass = document.getElementById("class").value;

      const confirmationBox = document.getElementById("confirmationBox");
      confirmationBox.style.display = "block";
      confirmationBox.innerHTML = `
        <h3>Reservation Confirmed ✅</h3>
        <p><strong>Name:</strong> ${name}</p>
        <p><strong>From:</strong> ${from}</p>git push -u origin main
        <p><strong>To:</strong> ${to}</p>
        <p><strong>Date:</strong> ${date}</p>
        <p><strong>Class:</strong> ${travelClass}</p>
      `;
    });
  </script>
</body>
</html>
